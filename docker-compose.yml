services:
  postgres:
    image: postgres:16-alpine
    container_name: school-project-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_catalog_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-project_catalog_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/WebApplication
      dockerfile: WebAPI/Dockerfile
    container_name: school-project-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-project_catalog_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      DemoData__SeedOnStartup: "true"
      Cors__AllowedOrigins__0: http://localhost:4200
      Cors__AllowedOrigins__1: http://172.17.195.1
      Cors__AllowedOrigins__2: http://172.17.195.1:4200
      Authentication__Authority: https://auth.htl-leonding.ac.at/realms/htlleonding
      Authentication__Audience: htlleonding-service
      Authentication__RequireHttpsMetadata: "false"
    ports:
      - "5144:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-project-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
